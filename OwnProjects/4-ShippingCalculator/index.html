<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Logistics</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h1 { text-align: center; color: #333; margin-bottom: 1.5rem; }
        
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-weight: bold; margin-bottom: 0.5rem; }
        select, input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        
        .radio-group { display: flex; gap: 1rem; margin-top: 5px; }
        
        button { width: 100%; background: #3b82f6; color: white; padding: 12px; border: none; border-radius: 5px; font-size: 1rem; cursor: pointer; transition: 0.3s; }
        button:hover { background: #2563eb; }

        /* Status Styles */
        .message { padding: 10px; margin-bottom: 15px; border-radius: 5px; text-align: center; font-weight: bold; margin: 10px 0; }
        .error { background-color: #fee2e2; color: #b91c1c; border: 1px solid #f87171; }
        .success { background-color: #dcfce7; color: #15803d; border: 1px solid #4ade80; }

        /* Spinner */
        #loader { display: none; margin: 20px auto; border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Result Box */
        #result { margin-top: 20px; text-align: center; }
        .result-box { background: #eff6ff; padding: 15px; border-radius: 5px; border: 1px solid #bfdbfe; }
    </style>
</head>
<body>

    <div class="card">
        <h1>📦 JS Logistics</h1>
        
        <form id="shipping-form">
            <div class="form-group">
                <label for="zone">Destination Zone:</label>
                <select id="zone">
                    <option value="">-- Select Zone --</option>
                    <option value="A">Zone A (Local)</option>
                    <option value="B">Zone B (National)</option>
                    <option value="C">Zone C (International)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="weight">Package Weight (kg):</label>
                <input type="number" id="weight" min="1" placeholder="Ex: 5">
            </div>

            <div class="form-group">
                <label>Delivery Speed:</label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="speed" value="standard" checked> Standard
                    </label>
                    <label>
                        <input type="radio" name="speed" value="express"> Express (+20%)
                    </label>
                </div>
            </div>

            <button type="submit">Calculate Cost</button>
        </form>

        <div id="loader"></div>

        <div id="result"></div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
